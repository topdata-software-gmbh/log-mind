[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logmind"
version = "0.1.0"
description = "AI-assisted log analyzer using LiteLLM and Qdrant"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Developer", email = "dev@example.com" },
]
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.7.0",
    "litellm>=1.0.0",
    "qdrant-client>=1.7.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
logmind = "logmind.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]

[tool.black]
line-length = 88
